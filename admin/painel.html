<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Painel — Confeitaria Fátima Bolos</title>

  <!--Fontes-->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com">
  <link rel="icon" type="image/svg+xml" href="/img/icon.svg?v=2">
  <link rel="icon" type="image/png" sizes="32x32" href="/img/favicon-32.png?v=2">
  <link rel="icon" type="image/x-icon" href="/favicon.ico?v=2">
  <link rel="apple-touch-icon" href="/img/apple-touch-icon.png?v=2">
  <link
    href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Plus+Jakarta+Sans:wght@400;500;600&display=swap"
    rel="stylesheet">

  <script src="https://accounts.google.com/gsi/client" async defer></script>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-color: #1a0a05;
      color: #ffdbce;
    }

    a {
      text-decoration: none;
      color: inherit;
    }

    /* =====================
       LOGIN
       ===================== */
    .login-caixa {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem;
    }

    .login-logo {
      font-family: 'Dancing Script', cursive;
      font-size: 2.5rem;
      color: #EDD5A8;
      margin-bottom: 0.5rem;
    }

    .login-subtitulo {
      font-size: 0.9rem;
      color: #C49060;
      margin-bottom: 2rem;
    }

    .login-campo {
      width: 100%;
      max-width: 320px;
      display: flex;
      flex-direction: column;
      gap: 0.4rem;
      margin-bottom: 1rem;
    }

    .login-campo label {
      font-size: 0.85rem;
      font-weight: 600;
      color: #C49060;
    }

    .login-campo input {
      background-color: #2C1008;
      border: 1.5px solid #3d1a0e;
      border-radius: 10px;
      padding: 0.8rem 1rem;
      color: #EDD5A8;
      font-size: 0.95rem;
      outline: none;
      transition: border 0.2s;
      width: 100%;
    }

    .login-campo input:focus {
      border-color: #EDD5A8;
    }

    #btn-login {
      width: 100%;
      max-width: 320px;
      background-color: #2C1008;
      color: #EDD5A8;
      border: 2px solid #EDD5A8;
      border-radius: 50px;
      padding: 0.8rem;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s;
    }

    #btn-login:hover {
      background-color: #EDD5A8;
      color: #2C1008;
    }

    .login-erro {
      color: #e8798f;
      font-size: 0.85rem;
      margin-top: 0.8rem;
      text-align: center;
      display: none;
    }

    .login-card {
      width: 100%;
      max-width: 380px;
      padding: 2.2rem 2rem;
      background-color: #2C1008;
      border: 1px solid #3d1a0e;
      border-radius: 20px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.35);
      text-align: center;
    }

    .login-card .login-subtitulo {
      margin-bottom: 1.6rem;
    }

    .login-form {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: left;
    }

    .login-card .login-campo,
    .login-card #btn-login {
      max-width: none;
    }

    .login-card .login-campo input {
      background-color: #1a0a05;
    }

    .login-senha {
      position: relative;
    }

    .login-senha input {
      padding-right: 3.2rem;
    }

    #btn-mostrar-senha {
      position: absolute;
      right: 0.4rem;
      bottom: 0.35rem;
      background: none;
      border: 0;
      padding: 0.45rem 0.6rem;
      color: #C49060;
      font-size: 0.75rem;
      font-weight: 600;
      cursor: pointer;
    }

    #btn-login {
      margin-top: 0.4rem;
      background-color: #EDD5A8;
      color: #2C1008;
    }

    #btn-login:hover {
      background-color: #C49060;
      border-color: #C49060;
    }

    #btn-login:disabled {
      opacity: 0.6;
      cursor: wait;
    }

    .login-divisor {
      display: flex;
      align-items: center;
      gap: 0.8rem;
      width: 100%;
      margin: 1.4rem 0;
      font-size: 0.8rem;
      color: #C49060;
    }

    .login-divisor::before,
    .login-divisor::after {
      content: '';
      flex: 1;
      height: 1px;
      background-color: #3d1a0e;
    }

    #google-btn-container {
      display: flex;
      justify-content: center;
    }

    /* =====================
       HEADER DO PAINEL
       ===================== */
    .painel-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 1rem 1.5rem;
      background-color: #2C1008;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .painel-logo {
      font-family: 'Dancing Script', cursive;
      font-size: 1.4rem;
      color: #EDD5A8;
    }

    #btn-sair {
      background: none;
      border: 1.5px solid #EDD5A8;
      border-radius: 50px;
      padding: 0.4rem 1rem;
      color: #EDD5A8;
      font-size: 0.85rem;
      cursor: pointer;
      transition: all 0.3s;
    }

    #btn-sair:hover {
      background-color: #EDD5A8;
      color: #2C1008;
    }

    /* =====================
       CONTEÚDO DO PAINEL
       ===================== */
    .painel-conteudo {
      padding: 2rem 1.5rem;
      max-width: 800px;
      margin: 0 auto;
    }

    .painel-titulo {
      font-family: 'Dancing Script', cursive;
      font-size: 2rem;
      color: #EDD5A8;
      margin-bottom: 2rem;
    }

    .painel-subtitulo {
      font-size: 0.9rem;
      color: #C49060;
      margin-bottom: 2rem;
    }

    .carregando {
      text-align: center;
      color: #C49060;
      padding: 2rem;
    }

    /* =====================
       CARDS DE PEDIDO
       ===================== */
    .pedido-card {
      background-color: #2C1008;
      border: 1.5px solid #3d1a0e;
      border-radius: 16px;
      padding: 1.5rem;
      margin-bottom: 1rem;
    }

    .pedido-card-topo {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 1rem;
    }

    .pedido-nome {
      font-size: 1.2rem;
      font-weight: 700;
      color: #EDD5A8;
    }

    .pedido-whatsapp {
      font-size: 0.85rem;
      color: #C49060;
      margin-top: 0.2rem;
    }

    .pedido-status {
      font-size: 0.75rem;
      font-weight: 700;
      padding: 0.3rem 0.8rem;
      border-radius: 50px;
    }

    .status-novo {
      background-color: #fce4ec;
      color: #880e4f;
    }

    .status-confirmado {
      background-color: #c8e6c9;
      color: #1b5e20;
    }

    .status-concluido {
      background-color: #eeeeee;
      color: #424242;
    }

    .pedido-detalhes {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.8rem;
      margin-bottom: 1rem;
    }

    .pedido-detalhe {
      background-color: #1a0a05;
      border-radius: 10px;
      padding: 0.6rem 0.8rem;
    }

    .pedido-detalhe-label {
      font-size: 0.7rem;
      color: #C49060;
      text-transform: uppercase;
      letter-spacing: 0.05rem;
      margin-bottom: 0.2rem;
    }

    .pedido-detalhe-valor {
      font-size: 0.9rem;
      color: #EDD5A8;
      font-weight: 500;
    }

    .pedido-foto {
      background-color: #1a0a05;
      border-radius: 10px;
      padding: 0.8rem;
      margin-bottom: 1rem;
    }

    .pedido-foto a {
      display: inline-block;
      color: #EDD5A8;
      font-size: 0.85rem;
    }

    .pedido-foto img {
      display: block;
      width: 100%;
      max-width: 260px;
      max-height: 260px;
      object-fit: cover;
      border-radius: 10px;
      border: 1.5px solid #3d1a0e;
      margin-top: 0.5rem;
    }

    .pedido-mensagem {
      background-color: #1a0a05;
      border-radius: 10px;
      padding: 0.8rem;
      font-size: 0.85rem;
      color: #C49060;
      font-style: italic;
      margin-bottom: 1rem;
    }

    .pedido-acoes {
      display: flex;
      gap: 0.8rem;
      flex-wrap: wrap;
    }

    .btn-confirmar {
      flex: 1;
      padding: 0.7rem;
      background-color: #1a0a05;
      color: #fff;
      border: none;
      border-radius: 10px;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.2s;
    }

    .btn-confirmar:hover {
      opacity: 0.85;
    }

    .btn-concluir {
      flex: 1;
      padding: 0.7rem;
      background-color: #2C1008;
      color: #EDD5A8;
      border: 1.5px solid #EDD5A8;
      border-radius: 10px;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }

    .btn-concluir:hover {
      background-color: #EDD5A8;
      color: #2C1008;
    }

    .btn-arquivar {
      background: none;
      border: 1.5px solid #7a4a35;
      border-radius: 10px;
      padding: 0.6rem 1rem;
      color: #7a4a35;
      font-size: 0.85rem;
      cursor: pointer;
      transition: all 0.2s;
    }

    .btn-arquivar:hover {
      border-color: #B8405F;
      color: #B8405F;

    }
  </style>
</head>

<body>

  <!--TELA DE LOGIN -->
  <div id="tela-login">

    <div class="login-caixa">
      <div class="login-card">
        <h1 class="login-logo">Confeitaria Fátima</h1>
        <p class="login-subtitulo">Painel Administrativo</p>

        <form id="form-login" class="login-form" novalidate>
          <div class="login-campo">
            <label for="login-email">E-mail</label>
            <input type="email" id="login-email" autocomplete="username" placeholder="seu@email.com" required>
          </div>
          <div class="login-campo login-senha">
            <label for="login-senha">Senha</label>
            <input type="password" id="login-senha" autocomplete="current-password" placeholder="Sua senha" required>
            <button type="button" id="btn-mostrar-senha" aria-label="Mostrar senha">Mostrar</button>
          </div>
          <button type="submit" id="btn-login">Entrar</button>
        </form>

        <div class="login-divisor">ou</div>

        <div id="google-btn-container"></div>
        <p id="login-erro" class="login-erro" role="alert">Acesso não autorizado para essa conta.</p>
      </div>
    </div>

  </div>

  <!-- PAINEL PRINCIPAL (começa escondida) -->
  <div id="painel" style="display:none">

    <!--HEADER-->
    <header class="painel-header">
      <h1 class="painel-logo">Confeitaria Fátima</h1>
      <button id="btn-sair">Sair</button>
    </header>

    <!--CONTEÚDO -->
    <main class="painel-conteudo">
      <h2 class="painel-titulo">Pedidos recebidos</h2>
      <p class="painel-subtitulo">Gerencie as encomendas da confeitaria</p>

      <!--LISTA DE PEDIDOS -->
      <div id="lista-pedidos">
        <p class="carregando">Carregando pedidos...</p>
      </div>
    </main>

  </div>

  <script>

    // =====================
    // CONFIGURAÇÕES
    // =====================
    const URL_PLANILHA = 'https://script.google.com/macros/s/AKfycbydy8rZFfhOJvWK3WBv8YDpAUr9hgkz_0uEy-d6M4p9zXqY5nViLQRX6cF8EUUMvl_4XQ/exec';
    const GOOGLE_CLIENT_ID ='SEU_CLIENT_ID_AQUI.apps.gooogleusercontent.com';


    // =====================
    // LOGIN COM GOOGLE
    // =====================
    window.onload = function () {
      google.accounts.id.initialize({
    client_id: '814272667016-c84m7qhs6dqjshkh17b590chnsorso6a.apps.googleusercontent.com',
    callback: aoLogar
});
        
      google.accounts.id.renderButton(
        document.getElementById('google-btn-container'),
        { theme: 'outline', size: 'large', text: 'signin_with' }
      );
    };

    async function aoLogar(resposta) {
      const erro = document.getElementById('login-erro');
      erro.textContent = 'Acesso não autorizado para essa conta.';
      erro.style.display = 'none';

      // envia o token pro Apps Script verificar se o e-mail é autorizado
     const verificacao = await fetch(URL_PLANILHA, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify({ acao: 'verificarLogin', token: resposta.credential })
});

      const resultado = await verificacao.json();

     if (resultado.autorizado) {
        document.getElementById('tela-login').style.display = 'none';
        document.getElementById('painel').style.display = 'block';
        carregarPedidos();
      } else {
        erro.style.display = 'block';
    }
  }
    // =====================
    // LOGIN COM E-MAIL E SENHA
    // A conferência da senha é feita no Apps Script (ação "verificarSenha").
    // =====================
    function mostrarErroLogin(texto) {
      const erro = document.getElementById('login-erro');
      erro.textContent = texto;
      erro.style.display = 'block';
    }

    document.getElementById('btn-mostrar-senha').addEventListener('click', function () {
      const campo = document.getElementById('login-senha');
      const mostrar = campo.type === 'password';
      campo.type = mostrar ? 'text' : 'password';
      this.textContent = mostrar ? 'Ocultar' : 'Mostrar';
      this.setAttribute('aria-label', mostrar ? 'Ocultar senha' : 'Mostrar senha');
    });

    document.getElementById('form-login').addEventListener('submit', async function (e) {
      e.preventDefault();
      const email = document.getElementById('login-email').value.trim();
      const senha = document.getElementById('login-senha').value;
      const botao = document.getElementById('btn-login');
      document.getElementById('login-erro').style.display = 'none';

      if (!email || !senha) {
        mostrarErroLogin('Preencha o e-mail e a senha.');
        return;
      }

      botao.disabled = true;
      botao.textContent = 'Entrando...';
      try {
        const verificacao = await fetch(URL_PLANILHA, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify({ acao: 'verificarSenha', email: email, senha: senha })
        });
        const resultado = await verificacao.json();

        if (resultado.autorizado) {
          document.getElementById('login-senha').value = '';
          document.getElementById('tela-login').style.display = 'none';
          document.getElementById('painel').style.display = 'block';
          carregarPedidos();
        } else {
          mostrarErroLogin('E-mail ou senha incorretos.');
        }
      } catch (erro) {
        mostrarErroLogin('Não foi possível entrar agora. Tente novamente.');
      } finally {
        botao.disabled = false;
        botao.textContent = 'Entrar';
      }
    });

    // botão sair
    document.getElementById('btn-sair').addEventListener('click', function () {
      document.getElementById('painel').style.display = 'none';
      document.getElementById('tela-login').style.display = 'block';
      document.getElementById('login-erro').style.display = 'none';
      google.accounts.id.disableAutoSelect();
    });

    // =====================
    // CARREGAR PEDIDOS
    // =====================
    async function carregarPedidos() {
      const lista = document.getElementById('lista-pedidos');
      lista.innerHTML = '<p class="carregando">Carregando pedidos...</p>';

      try {
        const resposta = await fetch(URL_PLANILHA + '?acao=listar', {
          method: 'GET',
          redirect: 'follow'
        });

        const texto = await resposta.text();
        const dados = JSON.parse(texto);

        if (!dados.pedidos || dados.pedidos.length === 0) {
          lista.innerHTML = '<p class="carregando">Nenhum pedido encontrado.</p>';
          return;
        }

        lista.innerHTML = '';
        dados.pedidos.reverse().forEach(function (pedido) {
          lista.innerHTML += criarCardPedido(pedido);
        });

      } catch (erro) {
        console.log('Erro:', erro);
        lista.innerHTML = '<p class="carregando">Erro ao carregar pedidos. Tente novamente.</p>';
      }
    }

    // =====================
    // SEGURANÇA: os dados vêm do formulário público, então são "escapados"
    // antes de entrar no HTML do painel.
    // =====================
    function esc(valor) {
      return String(valor === undefined || valor === null ? '' : valor)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    // texto do tamanho do bolo (pedidos novos guardam o valor inicial da faixa)
    const TAMANHOS = {
      '8': '8 a 10 pessoas', '10': '10 a 15 pessoas', '15': '15 a 20 pessoas',
      '25': '25 a 30 pessoas', '40': '40 a 50 pessoas', '50': '50 a 60 pessoas',
      '60+': 'Mais de 60 pessoas'
    };

    function textoTamanho(p) {
      const valor = String(p.porcoes).trim();
      if (valor === '60+') return TAMANHOS['60+'];
      // pedidos novos têm valor estimado; os antigos continuam como "fatias"
      if (p.valorEstimado && TAMANHOS[valor]) return TAMANHOS[valor];
      return valor + ' fatias';
    }

    // foto de referência: usa só o código do arquivo do Drive, nunca o link bruto
    function blocoFoto(p) {
      const achou = String(p.fotoLink || '').match(/^https:\/\/drive\.google\.com\/file\/d\/([A-Za-z0-9_-]+)/);
      if (!achou) return '';
      const id = achou[1];
      const abrir = 'https://drive.google.com/file/d/' + id + '/view';
      const miniatura = 'https://drive.google.com/thumbnail?id=' + id + '&sz=w600';
      return `
      <div class="pedido-foto">
        <p class="pedido-detalhe-label">Foto de referência</p>
        <a href="${abrir}" target="_blank" rel="noopener noreferrer">
          <img src="${miniatura}" alt="Foto de referência do pedido" loading="lazy"
               onerror="this.replaceWith(document.createTextNode('Abrir foto'))">
        </a>
      </div>`;
    }

    // =====================
    // CRIAR CARD DO PEDIDO
    // =====================
    function criarCardPedido(p) {

      // formata as datas
      const dataEvento = p.dataEvento ? String(p.dataEvento).split('T')[0].split('-').reverse().join('/') : 'Não informado';
      const dataRecebido = p.data ? String(p.data).substring(0, 16).replace('T', ' ').split('-').join('/').replace(/(\d{4})\/(\d{2})\/(\d{2})/, '$3/$2/$1') : '';

      const statusClasse = p.status === 'Novo' ? 'status-novo' :
        p.status === 'Confirmado' ? 'status-confirmado' : 'status-concluido';

      const botoes = p.status === 'Novo'
        ? `<button class="btn-confirmar" onclick="atualizarStatus(${p.linha}, 'Confirmado')">✓ Confirmar</button>
       <button class="btn-concluir" onclick="atualizarStatus(${p.linha}, 'Concluído')">✔ Concluído</button>`
        : p.status === 'Confirmado'
          ? `<button class="btn-concluir" onclick="atualizarStatus(${p.linha}, 'Concluído')">✔ Marcar Concluído</button>`
         : `<button class="btn-arquivar" onclick="arquivarPedido(this, ${p.linha})">✕ Remover da lista</button>`;

      return `
    <div class="pedido-card">
      <div class="pedido-card-topo">
        <div>
          <p class="pedido-nome">${esc(p.nome)}</p>
          <p class="pedido-whatsapp">💬 ${esc(p.whatsapp)}</p>
        </div>
        <span class="pedido-status ${statusClasse}">${esc(p.status)}</span>
      </div>

      <div class="pedido-detalhes">
        <div class="pedido-detalhe">
          <p class="pedido-detalhe-label">Data do Evento</p>
          <p class="pedido-detalhe-valor">📅 ${esc(dataEvento)}</p>
        </div>
        <div class="pedido-detalhe">
          <p class="pedido-detalhe-label">Porções</p>
          <p class="pedido-detalhe-valor">🎂 ${esc(textoTamanho(p))}</p>
        </div>
        <div class="pedido-detalhe">
          <p class="pedido-detalhe-label">Massa</p>
          <p class="pedido-detalhe-valor">${esc(p.massa)}</p>
        </div>
        <div class="pedido-detalhe">
          <p class="pedido-detalhe-label">Recheio 1ª Camada</p>
          <p class="pedido-detalhe-valor">${esc(p.recheio1)}</p>
        </div>
        <div class="pedido-detalhe">
          <p class="pedido-detalhe-label">Recheio 2ª Camada</p>
          <p class="pedido-detalhe-valor">${esc(p.recheio2)}</p>
        </div>
        ${p.decoracao ? `<div class="pedido-detalhe">
          <p class="pedido-detalhe-label">Decoração</p>
          <p class="pedido-detalhe-valor">${esc(p.decoracao)}</p>
        </div>` : ''}
        ${p.valorEstimado ? `<div class="pedido-detalhe">
          <p class="pedido-detalhe-label">Valor estimado</p>
          <p class="pedido-detalhe-valor">${esc(p.valorEstimado)}</p>
        </div>` : ''}
        <div class="pedido-detalhe">
          <p class="pedido-detalhe-label">Recebido em</p>
          <p class="pedido-detalhe-valor">${esc(dataRecebido)}</p>
        </div>
      </div>

      ${p.mensagem ? `<div class="pedido-mensagem">"${esc(p.mensagem)}"</div>` : ''}
      ${blocoFoto(p)}

      <div class="pedido-acoes">
        ${botoes}
      </div>
    </div>
  `;
    }

    // =====================
    // ATUALIZAR STATUS
    // =====================
    async function atualizarStatus(linha, novoStatus) {
      try {
        await fetch(URL_PLANILHA, {
          method: 'POST',
          mode: 'no-cors',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ acao: 'atualizarStatus', linha, status: novoStatus })
        });

        setTimeout(carregarPedidos, 1000);
      } catch (erro) {
        alert('Erro ao atualizar. Tente novamente.');
      }
    }

    function arquivarPedido(btn, linha) {
      if (!confirm('Remove este pedido da planilha tambem?')) return;

        const card = btn.closest('.pedido-card');
        card.style.transition = 'opacity 0.4s';
        card.style.opacity = '0';

        //remove da planilha
        fetch(URL_PLANILHA, {
          method: 'POST',
          mode: 'no-cors',
          headers: {'Content-type': 'application/json' },
          body: JSON.stringify({ acao: 'deletarLinha', linha: linha })
        });


        setTimeout(() => card.remove(), 400);
      }

      
  </script>
</body>
